# Tasks are POSIX shell. On Windows, point mise at Git Bash in your *global*
# config (mise ignores this setting in project files):
#   [settings]
#   windows_default_inline_shell_args = "'C:\\Program Files\\Git\\bin\\bash.exe' -c"
# Containers run with podman by default; set CONTAINER=docker to use Docker.

[tools]
go = "1.27.1"
node = "24.22.1"
pnpm = "12.15.0"
flatc = "25.9.23" # matches the flatbuffers npm runtime, the newest published
watchexec = "2.7.3"
"github:docker/compose" = "5.6.1"

[tasks.setup]
description = "Install client deps and the pre-push hook"
run = [
  "pnpm -C client install",
  "mise generate git-pre-commit --write --hook pre-push --task pre-push",
]

[tasks.gen]
description = "Regenerate committed code from schema/"
depends = ["vendor"]
run = "bash scripts/gen.sh"

[tasks."gen:diff"]
description = "Fail if gen leaves a diff"
depends = ["gen"]
run = "git diff --exit-code -- server/internal/gen client/src/gen && test -z \"$(git ls-files -o --exclude-standard -- server/internal/gen client/src/gen)\""

# Skipped unless go.mod/go.sum changed. Every task that compiles Go depends on
# this: with vendor/ present, go builds from it, and it must not be mid-rewrite.
[tasks.vendor]
hide = true
dir = "server"
sources = ["go.mod", "go.sum"]
outputs = ["vendor/modules.txt"]
run = "go mod vendor"

[tasks.build]
description = "Build the server .so with the matching pluginbuilder"
dir = "server"
# Not gen: it rewrites server/internal/gen, which the dev watcher would see
# as a change and rebuild forever. gen:diff keeps generated code current.
depends = ["vendor"]
run = [
  # MSYS_NO_PATHCONV stops Git Bash rewriting the container paths.
  "MSYS_NO_PATHCONV=1 ${CONTAINER:-podman} run --rm -w /builder -v ./:/builder:z docker.io/heroiclabs/nakama-pluginbuilder:3.41.0 build -buildmode=plugin -trimpath -mod=vendor -o ./build/halobattles.so .",
]

[tasks.dev]
description = "Run Nakama with .so rebuilds on Go changes, plus Vite"
depends = ["dev:server", "dev:mods", "dev:client"]

[tasks."dev:server"]
hide = true
run = [
  # Build first, then start Nakama once on the fresh .so. Starting it before
  # the build finished meant a second restart that dropped every Match.
  "mise run build",
  "${CONTAINER:-podman} compose -f deploy/compose.yml up -d --force-recreate nakama",
  # Watch sources, not server/: vendor/ churn shows up as events on server/
  # itself. Add new top-level Go dirs the .so builds from here. Queue, don't
  # restart: killing a build mid-vendor leaves vendor/ without modules.txt.
  "watchexec -w server/internal -w server/main.go -w server/go.mod -w server/go.sum --postpone --on-busy-update=queue --shell=none -- mise run dev:reload",
]

[tasks."dev:mods"]
hide = true
description = "Content edits need only a Nakama restart"
run = "watchexec -w mods --postpone --on-busy-update=queue --shell=none -- mise run dev:restart"

[tasks."dev:reload"]
hide = true
depends = ["build"]
run = "mise run dev:restart"

[tasks."dev:restart"]
hide = true
run = "${CONTAINER:-podman} compose -f deploy/compose.yml restart nakama"

[tasks."dev:client"]
hide = true
run = "pnpm -C client dev"

[tasks.test]
description = "Go and client tests"
depends = ["gen"] # gen rewrites the embedded schemas, so it can't run alongside
run =["cd server && go test ./...", "pnpm -C client test"]

[tasks."mods:check"]
description = "Validate the base Mod with halo-mod"
dir = "server"
depends = ["gen"]
run = "go run ./cmd/halo-mod check ../mods/base"

[tasks.fmt]
description = "Format Go (gofmt) and the client (Biome)"
run = [
  "cd server && gofmt -w $(git ls-files -co --exclude-standard '*.go')",
  "pnpm -C client exec biome check --write .",
]

[tasks.pre-push]
description = "Fast subset of check, run by the git pre-push hook"
depends = ["gen:diff", "test", "mods:check"]
run = "pnpm -C client typecheck"

[tasks.check]
description = "Everything: pre-push plus vet, gofmt, Biome and the .so build"
depends = ["pre-push"]
run = [
  "cd server && go vet ./...",
  # git ls-files skips the ignored vendor/.
  "cd server && out=$(gofmt -l $(git ls-files -co --exclude-standard '*.go')) && { test -z \"$out\" || { echo \"$out\"; exit 1; }; }",
  "pnpm -C client lint",
  "mise run build",
]


[tasks.down]
description = "stop container"
run = "${CONTAINER:-podman} compose -f deploy/compose.yml down"
