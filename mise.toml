# Tasks are POSIX shell. On Windows, point mise at Git Bash in your *global*
# config (mise ignores this setting in project files):
#   [settings]
#   windows_default_inline_shell_args = "'C:\\Program Files\\Git\\bin\\bash.exe' -c"
# Containers run with podman by default; set CONTAINER=docker to use Docker.

[tools]
go = "1.27.1"
node = "24.22.1"
pnpm = "12.15.0"
flatc = "25.12.19"
watchexec = "2.7.3"
"github:docker/compose" = "5.6.1"

[tasks.setup]
description = "Install client deps and the pre-push hook"
run = [
  "pnpm -C client install",
  "mise generate git-pre-commit --write --hook pre-push --task pre-push",
]

[tasks.gen]
description = "Regenerate committed code from schema/"
run = "echo 'nothing to generate yet'"

[tasks."gen:diff"]
description = "Fail if gen leaves a diff"
depends = ["gen"]
run = "git diff --exit-code -- server/internal/gen client/src/gen && test -z \"$(git status --porcelain -- server/internal/gen client/src/gen)\""

# Skipped unless go.mod/go.sum changed: recreating vendor/ would retrigger the
# dev watcher, which sees it as a change to server/ itself.
[tasks.vendor]
hide = true
dir = "server"
sources = ["go.mod", "go.sum"]
outputs = ["vendor/modules.txt"]
run = "go mod vendor"

[tasks.build]
description = "Build the server .so with the matching pluginbuilder"
dir = "server"
depends = ["vendor"]
run = [
  # MSYS_NO_PATHCONV stops Git Bash rewriting the container paths.
  "MSYS_NO_PATHCONV=1 ${CONTAINER:-podman} run --rm -w /builder -v ./:/builder:z docker.io/heroiclabs/nakama-pluginbuilder:3.41.0 build -buildmode=plugin -trimpath -mod=vendor -o ./build/halobattles.so .",
]

[tasks.dev]
description = "Run Nakama with .so rebuilds on Go changes, plus Vite"
depends = ["dev:server", "dev:client"]

[tasks."dev:server"]
hide = true
run = [
  "${CONTAINER:-podman} compose -f deploy/compose.yml up -d",
  "watchexec -w server -e go -i '**/vendor/**' --on-busy-update=restart --shell=none -- mise run dev:reload",
]

[tasks."dev:reload"]
hide = true
depends = ["build"]
run = "${CONTAINER:-podman} compose -f deploy/compose.yml restart nakama"

[tasks."dev:client"]
hide = true
run = "pnpm -C client dev"

[tasks.test]
description = "Go and client tests"
run = [
  "cd server && go test ./...",
  "pnpm -C client test",
]

[tasks.pre-push]
description = "Fast subset of check, run by the git pre-push hook"
depends = ["gen:diff", "test"]
run = "pnpm -C client typecheck"

[tasks.check]
description = "Everything: pre-push plus vet, gofmt, Biome and the .so build"
depends = ["pre-push"]
run = [
  "cd server && go vet ./...",
  # git ls-files skips the ignored vendor/.
  "cd server && out=$(gofmt -l $(git ls-files -co --exclude-standard '*.go')) && { test -z \"$out\" || { echo \"$out\"; exit 1; }; }",
  "pnpm -C client lint",
  "mise run build",
]
