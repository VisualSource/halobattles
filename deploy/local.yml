# dev only: Nakama's stock default keys. Never use these anywhere reachable.
# Production configs live in deploy/*.prod.yml, which is gitignored.
name: halobattles
logger:
  level: DEBUG
session:
  encryption_key: defaultencryptionkey
  refresh_encryption_key: defaultrefreshencryptionkey
socket:
  server_key: defaultkey
runtime:
  http_key: defaulthttpkey
match:
  # Refresh the open list's label index every tick (default 1000 ms), so a
  # lobby someone just left doesn't linger in the menu.
  label_update_interval_ms: 200
console:
  username: admin
  password: password
  signing_key: defaultsigningkey
